name: Daily release

# Every morning: merge experimental into main and, when CHANGELOG.md has an
# [Unreleased] section, turn it into the CalVer release of the previous day,
# the day the changes were made. Each release tag gets a release on GitHub with
# its section of the changelog, the signed Android APK and the packages of the
# desktop application.
# [impl->adr~calver-changelog~1]
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: daily-release

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: experimental
          fetch-depth: 0

      - uses: jbangdev/setup-jbang@2b1b465a7b75f4222b81426f23a01e013aa7b95c # v0.1.1

      - name: Release, merge, tag
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          repo="https://github.com/$GITHUB_REPOSITORY"
          d=$(date -u -d yesterday +%F)

          if [ -z "$(git rev-list origin/main..HEAD)" ] && ! grep -q '^## \[Unreleased\]' CHANGELOG.md; then
            echo "nothing to merge or release"; exit 0
          fi

          tag=
          if grep -q '^## \[Unreleased\]' CHANGELOG.md && ! git rev-parse -q --verify "refs/tags/v$d" >/dev/null; then
            previous=$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)
            if [ -n "$previous" ]; then
              link="$repo/compare/$previous...v$d"
            else
              link="$repo/releases/tag/v$d"
            fi
            sed -i -e "s/^## \[Unreleased\]\$/## [$d] - $d/" \
                   -e "s|^\[Unreleased\]: .*\$|[$d]: $link|" CHANGELOG.md
            jbang trust add https://github.com/nbbrd/
            jbang heylogs@nbbrd check CHANGELOG.md
            git commit -am "Release $d"
            git push origin HEAD:experimental
            tag="v$d"
          fi

          git switch main
          git merge --no-ff --no-edit -m "Merge experimental${tag:+: release $d}" experimental
          git push origin main
          if [ -n "$tag" ]; then
            git tag "$tag" main
            git push origin "$tag"
          fi

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # [impl->adr~signing-key-as-secret~1]
      - name: Provide the signing key
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/koppter-release.p12"
          echo "KOPPTER_KEYSTORE_FILE=$RUNNER_TEMP/koppter-release.p12" >> "$GITHUB_ENV"

      # Every release tag that has no APK yet, not only the tag of this run,
      # so that the next run makes up for a run that failed.
      - name: Publish the releases with the Android APK
        env:
          GH_TOKEN: ${{ github.token }}
          KOPPTER_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          jbang trust add https://github.com/nbbrd/
          for tag in $(git tag --list 'v[0-9]*' --sort=version:refname); do
            d=${tag#v}
            if gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null | grep -q '\.apk$'; then
              continue
            fi
            git checkout --quiet "$tag"
            KOPPTER_VERSION=$d ./gradlew :android:assembleRelease
            # Without the key, the build writes android-release-unsigned.apk and this step fails.
            cp android/build/outputs/apk/release/android-release.apk "$RUNNER_TEMP/koppter-$d.apk"
            if ! gh release view "$tag" >/dev/null 2>&1; then
              jbang heylogs@nbbrd extract --ref "$d" --output "$RUNNER_TEMP/notes.md" CHANGELOG.md
              gh release create "$tag" --verify-tag --title "$d" --notes-file "$RUNNER_TEMP/notes.md"
            fi
            gh release upload "$tag" "$RUNNER_TEMP/koppter-$d.apk" --clobber
          done

  # The package of the desktop application for each system, for every release that has none of it yet.
  desktop:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            extension: deb
          - os: windows-latest
            extension: msi
          - os: macos-latest
            extension: dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Publish the package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXTENSION: ${{ matrix.extension }}
        run: |
          set -euo pipefail
          for tag in $(git tag --list 'v[0-9]*' --sort=version:refname); do
            # The releases from before the packaging stay without packages.
            git grep --quiet nativeDistributions "$tag" -- app/build.gradle.kts || continue
            assets=$(gh release view "$tag" --json assets --jq '.assets[].name') || continue
            if grep --quiet "\\.$EXTENSION\$" <<< "$assets"; then
              continue
            fi
            git checkout --quiet "$tag"
            KOPPTER_VERSION=${tag#v} ./gradlew :app:packageDistributionForCurrentOS
            gh release upload "$tag" app/build/compose/binaries/main/"$EXTENSION"/*."$EXTENSION" --clobber
          done
